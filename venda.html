<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171612"><title>Venda guiada | OWN</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet"><style>
:root{--ink:#1d1b17;--muted:#746e63;--paper:#fffdf8;--gold:#aa8a3d;--line:#ded6c8;--bg:#ebe5db;--green:#34705c}*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(rgba(18,17,14,.84),rgba(18,17,14,.84)),url('pictures/own-showroom-bg.png') center/cover fixed;color:var(--ink)}button,input,select{font:inherit}.gate{min-height:100vh;display:grid;place-items:center;padding:20px}.authorized .gate{display:none}.authorized .app{display:block}.app{display:none}.gate-box{width:min(410px,100%);background:var(--paper);padding:30px;border-radius:18px;text-align:center}.brand{font:600 23px 'Playfair Display',serif;letter-spacing:.35em}.gate h1{font:600 28px 'Playfair Display';margin:22px 0 8px}.gate p{font-size:13px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;background:white}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}.primary{background:var(--gold);color:white}.soft{background:#eee7da;color:#514a3d}.top{background:rgba(22,21,18,.96);padding:14px 24px;color:white}.top-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px}.top .brand{color:white}.top nav{margin-left:auto;display:flex;gap:8px}.top a{color:white}.shell{max-width:1200px;margin:auto;padding:26px;display:grid;grid-template-columns:390px 1fr;gap:20px}.heading{grid-column:1/-1;color:white}.heading h1{font:600 34px 'Playfair Display';margin:0}.heading p{color:#c8c0b2;margin:7px 0 0}.card{background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.16)}.card h2{font:600 20px 'Playfair Display';margin:0;padding:17px 20px;border-bottom:1px solid var(--line)}.body{padding:19px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6d665b;margin-bottom:6px}.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;text-align:center;border:1px solid var(--line);padding:10px;border-radius:9px;font-size:12px}.choice input:checked+span{background:var(--ink);color:white}.build{width:100%;margin-top:5px}.intro{background:#f4efe6;border-left:3px solid var(--gold);padding:13px;font-size:12px;line-height:1.5;margin-bottom:15px}.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.offer{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:9px}.offer.recommended{border:2px solid var(--gold);position:relative}.badge{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);font-weight:700}.offer h3{font-size:14px;margin:0}.price{font:600 23px 'Playfair Display';color:#806624}.benefit{font-size:11px;color:var(--muted);line-height:1.45;min-height:48px}.offer .btn{margin-top:auto}.message{margin-top:15px;border:1px solid var(--line);border-radius:12px;padding:15px;background:#faf7f1}.message h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}.message-text{white-space:pre-wrap;font-size:13px;line-height:1.55}.copy{margin-top:12px}.empty{color:var(--muted);text-align:center;padding:55px 20px}.error{color:#a74739;font-size:12px;min-height:18px;margin-top:8px}@media(max-width:850px){.shell{grid-template-columns:1fr;padding:15px}.heading{grid-column:auto}.offers{grid-template-columns:1fr}.benefit{min-height:0}.top{padding:12px}.top nav a:first-child{display:none}.heading h1{font-size:28px}}
</style></head><body><section class="gate"><form class="gate-box" id="gate"><div class="brand">OWN</div><h1>Área interna</h1><p>Use o mesmo código do gerador de OS.</p><input id="code" type="password" required autofocus><button class="btn primary" style="width:100%;margin-top:10px">Entrar</button><div class="error" id="error"></div></form></section><div class="app"><header class="top"><div class="top-in"><span class="brand">OWN</span><nav><a class="btn soft" href="index.html">Site</a><a class="btn primary" href="os.html">Nova OS</a></nav></div></header><main class="shell"><div class="heading"><h1>Assistente de venda</h1><p>Entenda a necessidade, apresente três opções e ofereça o upgrade com clareza.</p></div><section class="card"><h2>Perfil da venda</h2><div class="body"><div class="field"><label for="client">Nome do cliente</label><input id="client" placeholder="Como prefere ser chamado"></div><div class="field"><label>Tipo de lente</label><div class="radios"><label class="choice"><input type="radio" name="kind" value="VS" checked><span>Visão simples</span></label><label class="choice"><input type="radio" name="kind" value="Multi"><span>Multifocal</span></label></div></div><div class="field" id="rangeField"><label>Faixa da receita</label><div class="radios"><label class="choice"><input type="radio" name="range" value="normal" checked><span>Faixa normal</span></label><label class="choice"><input type="radio" name="range" value="ext"><span>Grau/cilindro alto (Ext)</span></label></div></div><div class="field"><label for="treatment">Tratamento desejado</label><select id="treatment"><option value="AR">Antirreflexo</option><option value="AR Blue">Antirreflexo + Blue</option><option value="Foto AR">Fotossensível + AR</option><option value="Foto AR Blue">Fotossensível + AR + Blue</option></select></div><div class="field" id="priorityField"><label for="priority">Principal prioridade</label><select id="priority"><option value="economy">Economia</option><option value="resistance">Resistência</option><option value="thin">Lente mais fina</option><option value="thinnest">Máxima redução de espessura</option></select></div><div class="field"><label for="routine">Informação importante da rotina</label><input id="routine" placeholder="Ex.: usa telas e dirige à noite"></div><button class="btn primary build" id="build" type="button">Montar opções e mensagem</button></div></section><section class="card"><h2>Proposta para o cliente</h2><div class="body" id="result"><div class="empty">Preencha o perfil para gerar uma recomendação.</div></div></section></main></div><script src="catalogo.js"></script><script>
const HASH='11539fdb3ee7be0d6655af42596371cafe74885e109b8e7c966e30d53bc4988a',money=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),catalog=window.OWN_CATALOG||[],map=new Map(catalog);async function hash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function authorize(){document.body.classList.add('authorized');sessionStorage.setItem('own:staff-authorized','yes')}if(sessionStorage.getItem('own:staff-authorized')==='yes')authorize();document.querySelector('#gate').addEventListener('submit',async e=>{e.preventDefault();if(await hash(code.value.trim())===HASH)authorize();else error.textContent='Código incorreto.'});
const selected=n=>document.querySelector(`[name="${n}"]:checked`).value;function item(name){const price=map.get(name);return price===undefined?null:{name,price}}function vsOffers(ext,treatment,priority){const names=[`VS Essencial${ext?' Ext':''} ${treatment}`,`VS Poli ${ext?'Ext':'Essencial'} ${treatment}`,`VS Slim ${ext?'Ext':'Essencial'} ${treatment}`,`VS Super Slim${ext?' Ext':''} ${treatment}`],items=names.map(item).filter(Boolean);if(priority==='thin')return items.slice(1,4);if(priority==='thinnest')return items.slice(-3);return items.slice(0,3)}function multiOffers(treatment){const multiTreatment=treatment==='AR Blue'?'Blue':treatment,base=item('Multi Essencial Incolor'),target=item(`Multi Essencial ${multiTreatment}`),premium=item('Multi Essencial Foto AR Blue');return[base,target,premium].filter((x,i,a)=>x&&a.findIndex(y=>y.name===x.name)===i)}function benefit(name){if(name.includes('Super Slim'))return'Lente 1.74: máxima redução de espessura para graus elevados.';if(name.includes('Slim'))return'Lente de alto índice 1.60 ou 1.67, mais fina para graus maiores.';if(name.includes('Poli'))return'Policarbonato: opção leve e mais resistente a impactos.';if(name.includes('Foto'))return'Escurece sob ação da radiação UV e oferece praticidade ao ar livre.';if(name.includes('Blue'))return'Tratamento voltado ao conforto de quem utiliza telas com frequência.';return'Lente comum, com foco em economia e atendimento da necessidade principal.'}function explain(t){return t.includes('Foto')?'O tratamento fotossensível escurece com a radiação UV e é prático para quem alterna entre ambientes internos e externos. O antirreflexo melhora a transparência e reduz reflexos.':t.includes('Blue')?'O antirreflexo reduz reflexos e melhora a transparência. A versão Blue é voltada ao conforto de quem utiliza telas com frequência.':'O antirreflexo reduz os reflexos na superfície da lente, melhorando a transparência, a estética e o conforto visual.'}
function render(){const kind=selected('kind'),ext=selected('range')==='ext',t=treatment.value,p=priority.value,name=client.value.trim(),routine=document.querySelector('#routine').value.trim(),offers=kind==='VS'?vsOffers(ext,t,p):multiOffers(t);if(!offers.length){result.innerHTML='<div class="empty">Não encontrei essa combinação no catálogo atual.</div>';return}const recommended=offers[Math.min(1,offers.length-1)],first=offers[0],upgrade=offers[offers.length-1],difference=upgrade.price-recommended.price,greeting=name?`Olá, ${name}!`:'Olá!';const message=`${greeting} Analisei sua necessidade${routine?` e considerei que você ${routine}`:''}.\n\n${explain(t)}\n\nSeparei três possibilidades:\n${offers.map((o,i)=>`${i+1}. ${i===0?'Essencial':i===1?'Recomendada':'Premium'} — ${o.name}: ${money.format(o.price)}`).join('\n')}\n\nMinha recomendação é a ${recommended.name}, por ${money.format(recommended.price)}, porque oferece um bom equilíbrio entre necessidade, conforto e investimento.${upgrade!==recommended?`\n\nSe desejar um upgrade, por mais ${money.format(Math.max(0,difference))}, a ${upgrade.name} oferece ${benefit(upgrade.name).toLowerCase()}`:''}\n\nQual dessas opções combina melhor com o que você procura?`;result.innerHTML=`<div class="intro">Apresente as opções depois de confirmar a receita e a rotina. A recomendação abaixo é comercial e não substitui a avaliação da receita.</div><div class="offers">${offers.map((o,i)=>`<article class="offer ${o===recommended?'recommended':''}"><span class="badge">${i===0?'Essencial':o===recommended?'Recomendada':'Upgrade'}</span><h3>${o.name}</h3><div class="price">${money.format(o.price)}</div><div class="benefit">${benefit(o.name)}</div><button class="btn ${o===recommended?'primary':'soft'} use" data-name="${o.name}">Usar na OS</button></article>`).join('')}</div><div class="message"><h3>Mensagem pronta</h3><div class="message-text" id="messageText"></div><button class="btn soft copy" id="copy">Copiar mensagem</button></div>`;messageText.textContent=message;document.querySelectorAll('.use').forEach(b=>b.onclick=()=>{localStorage.setItem('own:suggested-product',JSON.stringify({name:b.dataset.name}));location.href='os.html'});copy.onclick=async()=>{await navigator.clipboard.writeText(message);copy.textContent='Mensagem copiada ✓'}}
document.querySelectorAll('[name="kind"]').forEach(r=>r.addEventListener('change',()=>{const multi=selected('kind')==='Multi';rangeField.style.display=multi?'none':'block';priorityField.style.display=multi?'none':'block'}));build.onclick=render;
</script></body></html>
